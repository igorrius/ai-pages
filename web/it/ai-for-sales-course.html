<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ШІ для продажів і керування бізнесом — курс на 12 тижнів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1d1f24;--mut:#6b6f78;--line:#e4e0d6;--acc:#0f6e64;--acc2:#e8f3f1;--warm:#c4622d;
--human:#fff1dc;--humanb:#e6a64b;--ai:#efe9ff;--aib:#8a6be0;--sys:#e2f4ef;--sysb:#2f9c84;--ok:#2f8f4e;--okb:#e6f5ea;--bad:#c2412d;--badb:#fbe9e5;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
a{color:var(--acc)}
code,pre,textarea.mono,#js-in,#csv-in{font-family:"JetBrains Mono",ui-monospace,monospace}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
aside{background:#1f2a2c;color:#d8e1df;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 30px}
.brand{font-weight:800;font-size:17px;color:#fff;padding:0 8px;line-height:1.3}
.brand small{display:block;color:#8fb3ad;font-weight:500;font-size:12.5px;margin-top:4px}
.ov{margin:16px 8px 8px}.ov-track{height:8px;background:#344245;border-radius:9px;overflow:hidden}
#ov-bar{height:100%;background:linear-gradient(90deg,#3fb59b,#9fe0c9);width:0;transition:width .4s}
.ov-l{font-size:12.5px;color:#8fb3ad;margin-top:6px;display:flex;justify-content:space-between}
#nav a{display:flex;align-items:center;gap:8px;color:#cdd7d5;text-decoration:none;padding:7px 10px;border-radius:9px;font-size:14px;line-height:1.3}
#nav a:hover{background:#2a3739}#nav a.active{background:#0f6e64;color:#fff}
.nav-month{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:#7f9c97;margin:18px 10px 6px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid #5d7472;flex:none}.dot.half{background:#e6a64b;border-color:#e6a64b}.dot.done{background:#3fb59b;border-color:#3fb59b}
.wn{font-weight:700;color:#8fb3ad;min-width:16px}
main{padding:40px clamp(18px,4vw,64px) 80px;max-width:1040px;outline:none;min-width:0}
#menu-btn{display:none}
h1{font-size:clamp(26px,3.4vw,36px);line-height:1.2;margin:.2em 0 .4em;letter-spacing:-.01em}
h2{font-size:21px;margin:42px 0 14px;display:flex;align-items:center;gap:10px}
h3{margin:0 0 6px;font-size:18px}
.sn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;font-size:15px;flex:none}
.muted{color:var(--mut);font-size:14.5px}
.crumbs{color:var(--mut);font-size:13.5px;font-weight:600}
.wk-icon{margin-right:10px}
.goal{font-size:17px;max-width:760px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:4px 12px;font-size:13.5px;font-weight:600}
.chip.ok{background:var(--okb);border-color:#bfe3c9;color:var(--ok)}.chip.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden}
.card summary{cursor:pointer;padding:15px 20px;font-weight:700;font-size:16.5px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.card summary::after{content:"＋";color:var(--acc)}.card[open] summary::after{content:"－"}
.card summary::-webkit-details-marker{display:none}
.card-body{padding:0 22px 16px}
.card-body p:first-child{margin-top:0}
.callout{background:var(--acc2);border-left:4px solid var(--acc);padding:12px 16px;border-radius:10px;margin:14px 0}
.callout.warn{background:#fff4e8;border-color:var(--warm)}.callout.small{font-size:14px}
.compare{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;margin:14px 0}
.compare>div{padding:12px 14px;border-radius:10px;font-size:14.5px}.bad{background:var(--badb)}.good{background:var(--okb)}
pre{background:#22292b;color:#e6efe9;padding:14px 16px;border-radius:10px;overflow:auto;font-size:13.5px;line-height:1.5}
code{background:#ece8de;padding:1px 6px;border-radius:5px;font-size:.9em}
table.t{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--panel)}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:#f0ede5}
.tbl-wrap{overflow:auto}
.readmark{display:flex;gap:10px;align-items:center;background:var(--panel);border:2px dashed var(--line);padding:12px 16px;border-radius:var(--r);margin-top:14px;cursor:pointer;font-weight:600}
input[type=checkbox],input[type=radio]{accent-color:var(--acc);width:18px;height:18px;flex:none}
/* diagram */
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.d-title{font-weight:700;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.node{background:#f2f0ea;border:2px solid #cfc9ba;border-radius:12px;padding:9px 13px;min-width:110px;text-align:center;line-height:1.25}
.node b{display:block;font-size:14px}.node small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.node.human{background:var(--human);border-color:var(--humanb)}.node.ai{background:var(--ai);border-color:var(--aib)}.node.sys{background:var(--sys);border-color:var(--sysb)}
.arr{color:var(--acc);font-weight:800;font-size:20px}
.branch{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--acc);padding-left:10px}
.brow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.legend .node{min-width:0;padding:2px 10px;font-size:12px}
/* widgets */
.widget{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin:12px 0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin-top:10px}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5}.btn.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc);padding:8px 14px}
.btn.big{font-size:17px;padding:13px 24px;margin-top:20px}.btn.danger{background:var(--bad)}
textarea,input[type=number],input:not([type]),select{width:100%;font:inherit;font-size:14.5px;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:#fcfbf8;color:var(--ink)}
textarea:focus,input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
label{font-size:14px;font-weight:600}
.pb{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:12px}
.pb-in label{display:block;margin-bottom:8px}.pb-in textarea{margin-top:3px;font-weight:400}
.meter{height:10px;background:#ece8de;border-radius:9px;overflow:hidden}#pb-bar{height:100%;transition:width .3s}
#pb-bar.r{background:var(--bad)}#pb-bar.y{background:#e6a64b}#pb-bar.g{background:var(--ok)}
.lvl{font-weight:800;margin:6px 0}.res{white-space:pre-wrap;min-height:120px}
.tips{font-size:13.5px;color:var(--mut);padding-left:18px}
.js{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:12px}
#js-in{font-size:13.5px;min-height:300px}#js-in.bad{border-color:var(--bad)}
.js-err{font-size:13.5px;margin-top:6px;color:var(--bad)}.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
.challenges{list-style:none;padding:0;margin:0 0 14px}.challenges li{padding:7px 10px;border-radius:8px;background:#f5f2ea;margin-bottom:6px;font-size:14px}
.challenges li.ok{background:var(--okb);color:var(--ok);font-weight:600}
.tree{font-family:"JetBrains Mono",monospace;font-size:13px;background:#faf8f3;border:1px solid var(--line);border-radius:9px;padding:8px;max-height:280px;overflow:auto}
.tree ul{list-style:none;margin:0;padding-left:16px;border-left:1px dashed #ccc}.tk{color:#8a3fb0}.tv.число{color:#1764b5}.tv.текст{color:#2f7a3c}.tv.так\/ні{color:var(--warm)}.tt{color:#999;font-size:11px}
#csv-in{font-size:13.5px}.csv-st{margin:10px 0;font-size:14px}
td.nan{background:var(--badb);color:var(--bad);font-weight:700}td.empty{background:#fff6d6}
.sort .srow{display:grid;grid-template-columns:1fr 200px;gap:6px 12px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px}
.srow.ok{background:var(--okb);border-color:#bfe3c9}.srow.no{background:var(--badb);border-color:#f0c4ba}.sx{grid-column:1/-1;font-size:13.5px}
.roi{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.roi label{display:flex;flex-direction:column;gap:4px;justify-content:space-between}
.roi-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.roi-out div{background:var(--acc2);border-radius:12px;padding:12px 14px}.roi-out span{display:block;font-size:13px;color:var(--mut)}.roi-out b{font-size:24px}
.roi-out .pos{background:var(--okb)}.roi-out .neg{background:var(--badb)}
.sim{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-top:10px}
.sim-cfg label.ck{display:flex;gap:8px;align-items:center;font-weight:500;margin:6px 0}.sim-cfg select{margin:4px 0 14px}
.sim-log{background:#faf8f3;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:520px;overflow:auto}
.sim-step{border-left:4px solid var(--sysb);background:#fff;border-radius:8px;padding:8px 12px;margin-bottom:8px;opacity:0;transform:translateY(8px);transition:.35s}
.sim-step.in{opacity:1;transform:none}.sim-step.trig{border-color:var(--humanb)}.sim-step.warn{border-color:var(--bad);background:var(--badb)}.sim-step.skip{border-color:#bbb;opacity:.7}
.sim-step pre{font-size:12px;margin:6px 0 0;padding:8px 10px;max-height:180px}.sn2{font-size:13px;color:var(--mut)}
.sim-end{font-weight:800;color:var(--ok);padding:6px}
/* quiz */
.q{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:14px 18px;margin:0 0 12px}
.q legend{font-weight:700;padding:0 6px;display:flex;gap:8px;align-items:flex-start}
.qn{background:var(--acc2);color:var(--acc);border-radius:50%;min-width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px}
.q.right{border-color:#bfe3c9}.q.wrong{border-color:#f0c4ba}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:9px;cursor:pointer;font-weight:500;font-size:15px}
.opt:hover{background:#f5f2ea}.opt.correct{background:var(--okb);font-weight:700}.opt.picked{background:var(--badb);text-decoration:line-through}
.opt input{margin-top:4px}
.expl{margin-top:8px;font-size:14.5px;background:#f7f5ef;padding:9px 12px;border-radius:9px}
.q-result{padding:14px 18px;border-radius:var(--r);font-size:16px}.q-result.ok{background:var(--okb)}.q-result.bad{background:var(--badb)}
.q-result .btn{margin:0 0 0 12px}
/* tasks */
.task{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:10px}
.task.done{border-color:#bfe3c9;background:#f8fcf9}
.task label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}.task label input{margin-top:4px}
.td{font-weight:400;color:#40444c;font-size:14.5px}
.task .note{margin-top:10px;font-size:13.5px}
.task.done b{text-decoration:line-through;text-decoration-color:var(--ok)}
.checks{padding-left:0;list-style:none}.checks li{padding:8px 0 8px 30px;position:relative;border-bottom:1px dashed var(--line)}
.checks li::before{content:"✓";position:absolute;left:4px;color:var(--acc);font-weight:800}
.mentor-note{background:var(--human);border-radius:var(--r);padding:14px 18px;margin-top:16px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:50px;flex-wrap:wrap}
.pager a{background:var(--panel);border:1px solid var(--line);padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:700}
.pager a.next{background:var(--acc);color:#fff;border-color:var(--acc)}
.lesson summary{align-items:center}.lno{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:20px;padding:1px 10px;font-size:12.5px;margin-right:10px;font-weight:800}
.lmeta{color:var(--mut);font-size:13px;font-weight:600;white-space:nowrap;margin-left:auto}.lesson summary::after{margin-left:10px}
.lesson.ldone{border-color:#bfe3c9}.lesson.ldone .lno{background:var(--okb);color:var(--ok)}
.lesson .card-body{font-size:16.5px;line-height:1.7;max-width:760px}.lesson h4{font-size:18px;margin:26px 0 8px}
.try{background:#fff7e6;border:1px solid #f0d6a4;border-radius:12px;padding:12px 16px;margin:18px 0}.try b:first-child{display:block;margin-bottom:4px}
.self{background:#f3f0ff;border:1px solid #d9cff7;border-radius:12px;padding:10px 16px;margin:14px 0}.self summary{cursor:pointer;font-weight:700}.self div{margin-top:8px}
.key{background:var(--okb);border-radius:12px;padding:12px 16px;margin:18px 0 6px}.key ul{margin:6px 0 0;padding-left:20px}
.res-h{margin:30px 0 10px}.res-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.res-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.res-card:hover{border-color:var(--acc)}.res-card b{color:var(--acc);font-size:15.5px}.res-top{display:flex;justify-content:space-between}
.badge{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:#eee;border-radius:20px;padding:2px 8px}.badge.req{background:var(--acc);color:#fff}
/* overview */
.hero{background:linear-gradient(135deg,#0f6e64,#1f4f5a);color:#fff;border-radius:22px;padding:36px clamp(20px,4vw,44px)}
.hero h1{color:#fff;font-size:clamp(28px,4vw,42px)}.hero p{font-size:17.5px;max-width:720px;opacity:.95}
.hero-tag{display:inline-block;background:rgba(255,255,255,.16);padding:4px 12px;border-radius:30px;font-size:13px;font-weight:700}
.hero .muted{color:#cde6e0}.hero .btn{background:#fff;color:var(--acc)}
.namefld{display:block;margin:16px 0 14px;max-width:360px;color:#e3f1ed}.namefld input{margin-top:4px;background:rgba(255,255,255,.95)}
.big-prog{height:10px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden;margin-bottom:6px;max-width:520px}.big-prog div{height:100%;background:#9fe0c9}
.outcomes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.outcomes div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.month{margin-bottom:22px}.m-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}.m-head span{color:var(--mut);font-size:14px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;transition:.15s}
.wcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.wcard.done{border-color:#bfe3c9;background:#f6fbf7}.wcard.half{border-color:#efd3a6}
.wc-top{display:flex;justify-content:space-between;font-size:20px}.wc-n{font-size:12.5px;color:var(--mut);font-weight:700}
.wcard b{line-height:1.3}.wcard small{color:var(--mut)}
.wc-prog{height:5px;background:#ece8de;border-radius:5px;overflow:hidden}.wc-prog div{height:100%;background:var(--ok)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}
.howto div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.howto span{display:block;font-size:14px;color:var(--mut)}
.search{max-width:420px;margin-top:6px}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.gloss div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.gloss dt{font-weight:800;color:var(--acc)}.gloss dd{margin:4px 0 0}
.report{white-space:pre-wrap;background:#fff;color:var(--ink);border:1px solid var(--line);max-height:520px}
@media (max-width:900px){
 .layout{grid-template-columns:minmax(0,1fr)}
 aside{position:fixed;inset:0 25% 0 0;z-index:20;transform:translateX(-105%);transition:.25s;height:100%}
 body.menu-open aside{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
 #menu-btn{display:flex;position:sticky;top:0;z-index:10;width:100%;background:#1f2a2c;color:#fff;border:0;padding:12px 18px;font:inherit;font-weight:700;gap:10px;align-items:center;cursor:pointer}
 main{padding-top:22px}
 .pb,.js,.sim,.compare{grid-template-columns:1fr}
 .sort .srow{grid-template-columns:1fr}
}
</style>
</head>
<body>
<button id="menu-btn" aria-label="Меню">☰ Зміст курсу</button>
<div class="layout">
<aside>
  <div class="brand">ШІ для продажів<br>і керування бізнесом<small>Курс на 12 тижнів</small></div>
  <div class="ov"><div class="ov-track"><div id="ov-bar"></div></div><div class="ov-l"><span>Прогрес</span><span id="ov-pct">0%</span></div></div>
  <nav id="nav"></nav>
</aside>
<main id="main" tabindex="-1"></main>
</div>
<script>
// Зміст курсу «ШІ для продажів і керування бізнесом»
const MONTHS = [
  { n: 1, title: "Фундамент", sub: "Як працює ШІ, як з ним говорити, як «розмовляють» програми" },
  { n: 2, title: "Автоматизація", sub: "Процеси, no-code сценарії, ШІ всередині автоматизацій, CRM" },
  { n: 3, title: "Агенти та керування", sub: "База знань, ШІ-агенти, звітність, впровадження, фінальний проєкт" }
];

const WEEKS = [
/* ───────────── ТИЖДЕНЬ 1 ───────────── */
{
  n: 1, month: 1, icon: "🧠",
  title: "Як працює ШІ — без магії",
  goal: "Зрозуміти, що таке мовна модель, де вона сильна, де помиляється, і налаштувати робочі інструменти.",
  time: "7–9 год",
  theory: [
    { h: "Що таке LLM (велика мовна модель)",
      p: `<p>ChatGPT, Claude, Gemini — це <b>великі мовні моделі (LLM)</b>. Простими словами, це дуже начитаний «автодоповнювач»: модель прочитала величезну кількість текстів і навчилась передбачати, яке слово найлогічніше йде далі.</p>
<p>З цього випливає головне: модель <b>не є базою даних</b>, не є калькулятором і не знає вашого прайсу, складу чи клієнтів, поки ви їй цього не дасте.</p>
<div class="callout">💡 <b>Аналогія:</b> ШІ — це геніальний стажер, у якого сьогодні перший робочий день. Він знає мову, психологію продажів, ділове листування. Але про вашу компанію він знає лише те, що ви поклали йому на стіл.</div>` },

<h4>Навіщо продажнику JSON</h4>
<p>Коли програми обмінюються даними — сайт передає заявку в CRM, CRM надсилає угоду в облікову систему, ШІ повертає результат в автоматизацію — вони майже завжди використовують формат <b>JSON</b>. На 2-му місяці ви щодня бачитимете JSON в n8n. Хто розуміє JSON — спокійно налаштовує інтеграції. Хто ні — губиться на першому ж кроці. Хороша новина: JSON простіший, ніж здається.</p>

<h4>JSON — це анкета</h4>
<p>JSON складається з пар <b>«ключ: значення»</b>. Ключ — назва поля, значення — його вміст. Як анкета: «Клієнт: СТО Мотор», «Місто: Київ».</p>

<p>Правила запису:</p>
<ul>
<li>Уся «анкета» — у <b>фігурних дужках</b> <code>{ }</code>. Це називається <b>об'єкт</b>.</li>
<li>Ключі — завжди в <b>подвійних лапках</b>.</li>
<li>Між ключем і значенням — <b>двокрапка</b>, між парами — <b>кома</b>. Після останньої пари коми немає.</li>

<h4>Списки і вкладеність: замовлення з позиціями</h4>

{ t: "API: як програми «замовляють» одна в одної", html: `
<h4>Аналогія з рестораном</h4>
<p>Ви сидите в ресторані (ваша програма). Кухня (чужа система — CRM, банк, Telegram) готує страви (дані). Ви не йдете на кухню самі — ви робите замовлення через <b>офіціанта</b> за <b>меню</b>. Офіціант — це <b>API</b> (Application Programming Interface — «інтерфейс для програм»), меню — це <b>документація API</b>: що можна замовити і як правильно сформулювати замовлення.</p>
<p>Кожна сучасна система — CRM, облікова система, служба доставки, банк, Telegram, сервіси ШІ — має свій API. Саме через API автоматизації з'єднують системи між собою.</p>

<p>Кожне «замовлення» (запит) має чотири частини:</p>

<li><code>PUT</code> / <code>PATCH</code> — змінити («зміни етап угоди»);</li>

{ t: "CRM для B2B-дистрибуції: сутності, воронка, дані", html: `
<h4>Навіщо CRM, якщо є облікова система</h4>
<p>Облікова система (BAS, 1С тощо) відповідає на питання «що продали, відвантажили, оплатили». <b>CRM</b> (Customer Relationship Management) — на питання «що відбувається з клієнтом і що робити далі»: хто з ким говорив, про що домовилися, які угоди в роботі, кому треба передзвонити. Облік — пам'ять про гроші, CRM — пам'ять про відносини.</p>

<h4>Основні сутності CRM</h4>
<table class="t"><tr><th>Сутність</th><th>Що це</th><th>Приклад</th></tr>
<tr><td><b>Компанія</b></td><td>Організація-клієнт</td><td>СТО Мотор (код К-017)</td></tr>
<tr><td><b>Контакт</b></td><td>Людина в компанії</td><td>Олег, власник; Іван, закупівельник</td></tr>
<tr><td><b>Угода</b></td><td>Конкретна можливість продажу з сумою і етапом</td><td>«Перехід на наші масла», 45 000 грн/міс</td></tr>
<tr><td><b>Задача</b></td><td>Що і коли зробити</td><td>Передзвонити Олегу в четвер</td></tr>
<tr><td><b>Активність</b></td><td>Що вже сталося</td><td>Дзвінок, зустріч, лист — з нотатками</td></tr></table>

<h4>Воронка (pipeline) та етапи</h4>
<p>Воронка — послідовність етапів, якими рухається угода. Для залучення нового клієнта-СТО це може бути:</p>
<ol>
<li><b>Новий лід</b> — дізналися про клієнта;</li>
<li><b>Контакт встановлено</b> — поговорили з особою, що приймає рішення;</li>
<li><b>Потреби виявлено</b> — знаємо асортимент, обсяги, поточних постачальників;</li>
<li><b>Пропозицію надіслано</b>;</li>
<li><b>Пробне замовлення</b>;</li>
<li><b>Постійний клієнт</b> (виграно) / <b>Втрачено</b> (з причиною).</li>
</ol>
<p>Головне — <b>критерії переходу</b>: що має статися, щоб угоду можна було перенести на наступний етап. Без них воронка показує не реальність, а настрій менеджерів.</p>

<h4>Специфіка B2B-дистрибуції</h4>
<p>У дистрибуції запчастин більшість виручки — <b>повторні замовлення постійних клієнтів</b>, а не нові угоди. Тому, крім воронки залучення, важливі:</p>
<ul>
<li><b>Сегментація клієнтів</b>: тип (СТО, магазин, автопарк), потенціал, ABC-група, менеджер;</li>
<li><b>Контроль регулярності</b>: звичний інтервал замовлень, дата останнього, тренд обсягів;</li>
<li><b>Розвиток клієнта (share of wallet)</b>: яку частку його закупівель ми маємо? Клієнт купує в нас фільтри, а гальма — у конкурента. Тут друга воронка: «розширення асортименту».</li>
</ul>

<h4>Якість даних — фундамент</h4>
<p>CRM, де половина полів порожня, угоди не закриваються, а клієнти задубльовані, — гірше, ніж Excel: їй не вірять, і нею не користуються. Правила, які встановлює керівник відділу продажів:</p>
<ul>
<li>Обов'язкові поля на кожному етапі (не можна перейти на «Пропозицію надіслано» без суми).</li>
<li>Причина втрати — обов'язкова і з довідника, а не довільним текстом.</li>

<script>
(function () {
  "use strict";
  const KEY = "ai-sales-course-v1";
  const PASS = 0.75;
  let S = { read: {}, lessons: {}, quiz: {}, tasks: {}, notes: {}, name: "" };
  let canStore = true;
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) { canStore = false; }
  S.lessons = S.lessons || {};
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { canStore = false; } renderNav(); }

  if (typeof QUIZ_EXTRA !== "undefined") WEEKS.forEach((w) => { w.quiz = w.quiz.concat(QUIZ_EXTRA[w.n] || []); });
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const W = (n) => WEEKS.find((w) => w.n === n);

  /* ───── progress helpers ───── */
  const LS = (w) => (typeof LESSONS !== "undefined" && LESSONS[w.n]) || null;
  function isRead(w) { const L = LS(w); if (!L) return !!S.read[w.n]; const d = S.lessons[w.n] || {}; return L.every((_, i) => d[i]); }
  function lessonsDone(w) { const L = LS(w); const d = S.lessons[w.n] || {}; return L ? L.filter((_, i) => d[i]).length : (S.read[w.n] ? 1 : 0); }
  const words = (h) => h.replace(/<[^>]+>/g, " ").split(/\s+/).filter(Boolean).length;
  const cnt = (h, c) => (h.match(new RegExp('class="' + c + '"', "g")) || []).length;
  const readMin = (h) => Math.max(5, Math.round((words(h) / 100 + cnt(h, "try") * 10 + cnt(h, "self") * 2) / 5) * 5);
  const pureRead = (h) => Math.max(3, Math.round(words(h) / 100));
  function theoryMin(w) { const L = LS(w); let m = L ? L.reduce((a, l) => a + readMin(l.html), 0) : 10; const R = (typeof RESOURCES !== "undefined" && RESOURCES[w.n]) || []; R.filter((r) => r.req).forEach((r) => (m += r.min)); return m; }
  const fmtMin = (m) => m >= 60 ? (Math.floor(m / 60) + " год" + (m % 60 ? " " + (m % 60) + " хв" : "")) : m + " хв";
  function tasksDone(w) { const t = S.tasks[w.n] || {}; return w.tasks.filter((_, i) => t[i]).length; }
  function quizPassed(w) { const q = S.quiz[w.n]; return q && q.checked && q.score / w.quiz.length >= PASS; }
  function weekState(w) {
    const parts = [isRead(w), quizPassed(w), tasksDone(w) === w.tasks.length];
    const done = parts.filter(Boolean).length;
    return { done, total: 3, complete: done === 3, started: done > 0 || tasksDone(w) > 0 || lessonsDone(w) > 0 || (S.quiz[w.n] && S.quiz[w.n].checked) };
  }
  function overall() {
    let d = 0, t = 0;
    WEEKS.forEach((w) => { const L = LS(w); d += (L ? lessonsDone(w) / L.length : (S.read[w.n] ? 1 : 0)) + (quizPassed(w) ? 1 : 0) + tasksDone(w) / w.tasks.length; t += 3; });
    return Math.round((d / t) * 100);
  }

  /* ───── navigation ───── */
  function renderNav() {
    const nav = $("#nav");
    let h = `<a href="#overview" data-r="overview">🏠 Огляд курсу</a>`;
    MONTHS.forEach((m) => {
      h += `<div class="nav-month">Місяць ${m.n} · ${m.title}</div>`;
      WEEKS.filter((w) => w.month === m.n).forEach((w) => {
        const st = weekState(w);
        const dot = st.complete ? "done" : st.started ? "half" : "";
        h += `<a href="#week-${w.n}" data-r="week-${w.n}"><span class="dot ${dot}"></span><span class="wn">${w.n}</span> ${w.title}</a>`;
      });
    });
    h += `<div class="nav-month">Довідка</div>
      <a href="#glossary" data-r="glossary">📖 Глосарій</a>
      <a href="#report" data-r="report">📤 Звіт для ментора</a>
      <a href="#mentor" data-r="mentor">🧑‍🏫 Для ментора</a>`;
    nav.innerHTML = h;
    const cur = location.hash.slice(1) || "overview";
    nav.querySelectorAll("a").forEach((a) => a.classList.toggle("active", a.dataset.r === cur));
    const p = overall();
    $("#ov-bar").style.width = p + "%";
    $("#ov-pct").textContent = p + "%";
  }

  function route() {
    const h = location.hash.slice(1) || "overview";
    const main = $("#main");
    document.body.classList.remove("menu-open");
    if (h.startsWith("week-")) { const w = W(parseInt(h.slice(5), 10)); if (w) { main.innerHTML = weekPage(w); bindWeek(w); } else main.innerHTML = overviewPage(); }
    else if (h === "glossary") { main.innerHTML = glossaryPage(); bindGlossary(); }
    else if (h === "report") { main.innerHTML = reportPage(); bindReport(); }
    else if (h === "mentor") main.innerHTML = mentorPage();
    else { main.innerHTML = overviewPage(); bindOverview(); }
    renderNav();
    window.scrollTo(0, 0);
    main.focus({ preventScroll: true });
  }

  /* ───── diagram ───── */
  function node(n) { return `<div class="node ${n.k || ""}"><b>${n.t}</b>${n.s ? `<small>${n.s}</small>` : ""}</div>`; }
  function flow(nodes) {
    return nodes.map((n) => n.branch
      ? `<div class="branch">${n.branch.map((row) => `<div class="brow">${flow(row)}</div>`).join("")}</div>`
      : node(n)).join(`<div class="arr">→</div>`);
  }
  function diagram(d) {
    return `<div class="diagram"><div class="d-title">${d.title}</div><div class="flow">${flow(d.nodes)}</div>
      <div class="legend"><span class="node human">людина</span><span class="node ai">ШІ</span><span class="node sys">автоматизація</span><span class="node">дані / подія</span></div></div>`;
  }

  /* ───── week page ───── */
  function weekPage(w) {
    const m = MONTHS[w.month - 1];
    const q = S.quiz[w.n] || {};
    const st = weekState(w);
    const prevW = W(w.n - 1), nextW = W(w.n + 1);
    const prevDone = !prevW || weekState(prevW).complete;
    let h = `<header class="wk-head">
      <div class="crumbs">Місяць ${m.n}: ${m.title} · Тиждень ${w.n} з 12</div>
      <h1><span class="wk-icon">${w.icon}</span>${w.title}</h1>
      <p class="goal"><b>Мета тижня:</b> ${w.goal}</p>
      <div class="chips"><span class="chip">⏱ Разом ${w.time}</span>
        <span class="chip ${isRead(w) ? "ok" : ""}">📘 Теорія ~${fmtMin(theoryMin(w))} ${LS(w) ? "· уроки " + lessonsDone(w) + "/" + LS(w).length : (isRead(w) ? "✓" : "")}</span>
        <span class="chip ${quizPassed(w) ? "ok" : ""}">📝 Тест ${q.checked ? Math.round((q.score / w.quiz.length) * 100) + "%" : "—"}</span>
        <span class="chip ${tasksDone(w) === w.tasks.length ? "ok" : ""}">🛠 Практика ${tasksDone(w)}/${w.tasks.length}</span>
        ${st.complete ? `<span class="chip done">🏆 Тиждень зараховано</span>` : ""}</div>
      ${!prevDone ? `<div class="callout warn small">Попередній тиждень ще не зараховано. Можна читати далі, але краще спершу закрити тест і практику тижня ${prevW.n} — матеріал будується послідовно.</div>` : ""}
    </header>`;

    const L = LS(w);
    h += `<section><h2><span class="sn">1</span> Теорія</h2>`;
    if (L) {
      h += `<p class="muted">${L.length} уроки: ~${fmtMin(L.reduce((a, l) => a + pureRead(l.html), 0))} читання + ~${fmtMin(L.reduce((a, l) => a + readMin(l.html) - pureRead(l.html), 0))} вправ + матеріали для поглиблення нижче. Читайте не поспіхом і виконуйте вправи «Спробуйте зараз»: саме вони перетворюють прочитане на навичку.</p>`;
      const ld = S.lessons[w.n] || {};
      const firstOpen = L.findIndex((_, i) => !ld[i]);
      L.forEach((l, i) => {
        h += `<details class="card lesson ${ld[i] ? "ldone" : ""}" ${i === firstOpen ? "open" : ""}><summary><span><span class="lno">Урок ${i + 1}</span>${l.t}</span><span class="lmeta">${ld[i] ? "✓ пройдено · " : ""}~${readMin(l.html)} хв</span></summary>
          <div class="card-body">${l.html}<label class="readmark"><input type="checkbox" data-l="${i}" ${ld[i] ? "checked" : ""}> Урок пройдено: прочитав(ла), виконав(ла) вправу і відповів(ла) на «Перевірте себе»</label></div></details>`;
      });
    } else {
      w.theory.forEach((t, i) => {
        h += `<details class="card" ${i === 0 ? "open" : ""}><summary>${t.h}</summary><div class="card-body">${t.p}</div></details>`;
      });
      h += `<label class="readmark"><input type="checkbox" id="read" ${S.read[w.n] ? "checked" : ""}> Я прочитав(ла) і зрозумів(ла) теорію цього тижня</label>`;
    }
    const R = (typeof RESOURCES !== "undefined" && RESOURCES[w.n]) || [];
    if (R.length) {
      h += `<h3 class="res-h">📚 Матеріали для поглиблення</h3><div class="res-list">${R.map((r) => `<a class="res-card" href="${r.url}" target="_blank" rel="noopener"><div class="res-top"><span class="badge ${r.req ? "req" : ""}">${r.req ? "Рекомендовано" : "За бажанням"}</span><span class="muted">~${fmtMin(r.min)}</span></div><b>${r.t}</b><span class="muted">${r.src}</span><span>${r.d}</span></a>`).join("")}</div>`;
    }
    h += `</section>`;

    h += `<section><h2><span class="sn">2</span> Схема</h2>${diagram(w.diagram)}</section>`;

    let s = 3;
    if (w.widgets.length) {
      h += `<section><h2><span class="sn">${s++}</span> Тренажер</h2>`;
      w.widgets.forEach((k) => (h += `<div class="widget" id="wg-${k}">${WIDGETS[k].html()}</div>`));
      h += `</section>`;
    }

    h += `<section><h2><span class="sn">${s++}</span> Перевірка знань</h2><p class="muted">Прохідний бал — ${PASS * 100}%. Можна перескладати скільки завгодно.</p><div id="quiz"></div></section>`;

    h += `<section><h2><span class="sn">${s++}</span> Практичні завдання</h2>
      <p class="muted">Позначайте виконане й додавайте посилання чи короткий коментар: усе це потрапить у звіт для ментора.</p><div class="tasks">`;
    w.tasks.forEach((t, i) => {
      const done = (S.tasks[w.n] || {})[i];
      const note = ((S.notes[w.n] || {})[i]) || "";
      h += `<div class="task ${done ? "done" : ""}"><label><input type="checkbox" data-t="${i}" ${done ? "checked" : ""}><span><b>${t.t}</b><br><span class="td">${t.d}</span></span></label>
        <input class="note" data-n="${i}" placeholder="Посилання / результат / нотатка" value="${esc(note)}"></div>`;
    });
    h += `</div></section>`;

    h += `<section><h2><span class="sn">${s++}</span> Ви засвоїли тиждень, якщо можете:</h2><ul class="checks">${w.check.map((c) => `<li>${c}</li>`).join("")}</ul>
      <div class="mentor-note">🧑‍🏫 <b>Зустріч з ментором:</b> ${w.mentor}</div></section>`;

    h += `<nav class="pager">${prevW ? `<a href="#week-${prevW.n}">← Тиждень ${prevW.n}</a>` : `<a href="#overview">← Огляд</a>`}
      ${nextW ? `<a href="#week-${nextW.n}" class="next">Тиждень ${nextW.n}: ${nextW.title} →</a>` : `<a href="#report" class="next">Звіт для ментора →</a>`}</nav>`;
    return h;
  }

  function bindWeek(w) {
    const rd = $("#read"); if (rd) rd.addEventListener("change", (e) => { S.read[w.n] = e.target.checked; save(); refreshChips(w); });
    document.querySelectorAll("input[data-l]").forEach((c) => c.addEventListener("change", (e) => {
      S.lessons[w.n] = S.lessons[w.n] || {}; S.lessons[w.n][e.target.dataset.l] = e.target.checked; save();
      const card = e.target.closest(".lesson"); card.classList.toggle("ldone", e.target.checked);
      const meta = card.querySelector(".lmeta"); meta.textContent = (e.target.checked ? "✓ пройдено · " : "") + meta.textContent.replace("✓ пройдено · ", "");
      if (e.target.checked) { card.open = false; const nx = card.nextElementSibling; if (nx && nx.classList.contains("lesson") && !nx.classList.contains("ldone")) { nx.open = true; nx.scrollIntoView({ behavior: "smooth", block: "start" }); } }
      refreshChips(w);
    }));
    document.querySelectorAll(".task input[type=checkbox]").forEach((c) => c.addEventListener("change", (e) => {
      S.tasks[w.n] = S.tasks[w.n] || {}; S.tasks[w.n][e.target.dataset.t] = e.target.checked;
      e.target.closest(".task").classList.toggle("done", e.target.checked); save(); refreshChips(w);
    }));
    document.querySelectorAll(".task .note").forEach((c) => c.addEventListener("input", (e) => {
      S.notes[w.n] = S.notes[w.n] || {}; S.notes[w.n][e.target.dataset.n] = e.target.value; save();
    }));
    renderQuiz(w);
    w.widgets.forEach((k) => WIDGETS[k].bind($("#wg-" + k)));
  }
  function refreshChips(w) {
    const tmp = document.createElement("div"); tmp.innerHTML = weekPage(w);
    $(".wk-head .chips").innerHTML = tmp.querySelector(".chips").innerHTML;
  }

  /* ───── quiz ───── */
  function renderQuiz(w) {
    const box = $("#quiz");
    const q = S.quiz[w.n] || { ans: {}, checked: false };
    let h = "";
    w.quiz.forEach((it, i) => {
      const a = q.ans[i];
      h += `<fieldset class="q ${q.checked ? (a === it.a ? "right" : "wrong") : ""}"><legend><span class="qn">${i + 1}</span>${it.q}</legend>`;
      it.o.forEach((o, j) => {
        let cls = "";
        if (q.checked) { if (j === it.a) cls = "correct"; else if (j === a) cls = "picked"; }
        h += `<label class="opt ${cls}"><input type="radio" name="q${i}" value="${j}" ${a === j ? "checked" : ""} ${q.checked ? "disabled" : ""}> ${esc(o)}</label>`;
      });
      if (q.checked) h += `<div class="expl">${a === it.a ? "✅ Правильно." : "❌ Не зовсім."} ${it.e}</div>`;
      h += `</fieldset>`;
    });
    if (q.checked) {
      const pct = Math.round((q.score / w.quiz.length) * 100);
      const ok = pct / 100 >= PASS;
      h += `<div class="q-result ${ok ? "ok" : "bad"}"><b>${q.score} з ${w.quiz.length} (${pct}%)</b> — ${ok ? "тест складено! 🎉" : "поки що замало. Перечитайте теорію і спробуйте ще раз."}
        <button class="btn ghost" id="q-retry">Пройти ще раз</button></div>`;
    } else h += `<button class="btn" id="q-check">Перевірити відповіді</button><span class="muted" id="q-msg"></span>`;
    box.innerHTML = h;

    box.querySelectorAll("input[type=radio]").forEach((r) => r.addEventListener("change", (e) => {
      const st = S.quiz[w.n] || { ans: {}, checked: false };
      st.ans[e.target.name.slice(1)] = parseInt(e.target.value, 10); S.quiz[w.n] = st; save();
    }));
    const chk = $("#q-check");
    if (chk) chk.addEventListener("click", () => {
      const st = S.quiz[w.n] || { ans: {} };
      if (Object.keys(st.ans).length < w.quiz.length) { $("#q-msg").textContent = " Дайте відповідь на всі питання."; return; }
      st.score = w.quiz.filter((it, i) => st.ans[i] === it.a).length; st.checked = true; S.quiz[w.n] = st; save();
      renderQuiz(w); refreshChips(w);
    });
    const rt = $("#q-retry");
    if (rt) rt.addEventListener("click", () => { S.quiz[w.n] = { ans: {}, checked: false, best: Math.max((S.quiz[w.n] || {}).score || 0, (S.quiz[w.n] || {}).best || 0) }; save(); renderQuiz(w); refreshChips(w); });
  }

    csv: {
      html: () => `<h3>📋 Перевірка CSV</h3><p class="muted">Це «брудна» вигрузка продажів. Виправте текст так, щоб не залишилось червоних (не число в числовому стовпці) і жовтих (порожньо) клітинок. Таблиця оновлюється на льоту.</p>

2026-03-02;Клієнт_017;Фільтри;4;4500
2026-03-02;Клієнт_004;Гальма;2;12 800 грн
2026-03-03;;Масла;10;9300
2026-03-04;Клієнт_017;Фільтри;два;2250
2026-03-05;Клієнт_009;Акумулятори;1;5100</textarea>
        <div id="csv-st" class="csv-st"></div><div class="tbl-wrap"><table class="t" id="csv-t"></table></div>`,
      bind() {
        const upd = () => {
          const lines = $("#csv-in").value.split(/\r?\n/).filter((l) => l.trim());
          if (!lines.length) return;
          const d = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ";" : ",";
          const rows = lines.map((l) => l.split(d).map((c) => c.trim()));
          const head = rows[0], numCols = head.map((x) => /сума|кільк|qty|sum|ціна/i.test(x));

    flow: {
      html: () => `<h3>🔀 Симулятор сценарію</h3><p class="muted">Оберіть тригер і кроки, натисніть «Запустити» — і подивіться, як JSON змінюється на кожному кроці. Спробуйте тригер «Email» без кроку екстракції — що станеться з угодою в CRM?</p>
        <div class="sim"><div class="sim-cfg"><label>Тригер<select id="sim-tr"><option value="form">📝 Google Form (структурована заявка)</option><option value="email">✉️ Email від клієнта (вільний текст)</option><option value="tg">💬 Повідомлення в Telegram</option></select></label>
          <div class="d-title">Кроки</div>${SIM_STEPS.map((s, i) => `<label class="ck"><input type="checkbox" data-s="${i}" ${s.def ? "checked" : ""}> ${s.icon} ${s.name}</label>`).join("")}
          <button class="btn" id="sim-run">▶ Запустити</button></div>
        <div class="sim-log" id="sim-log"><p class="muted">Тут з'явиться виконання сценарію…</p></div></div>`,
      bind() {
        $("#sim-run").addEventListener("click", async () => {
          const btn = $("#sim-run"); btn.disabled = true;
          const tr = $("#sim-tr").value;
          let data = JSON.parse(JSON.stringify(SIM_INPUT[tr]));
          const steps = [...document.querySelectorAll(".sim-cfg input:checked")].map((c) => SIM_STEPS[+c.dataset.s]);
          const log = $("#sim-log"); log.innerHTML = "";
          const add = (title, cls, obj, note) => {
            const d = document.createElement("div"); d.className = "sim-step " + cls;
            d.innerHTML = `<b>${title}</b>${note ? `<div class="sn2">${note}</div>` : ""}<pre>${esc(JSON.stringify(obj, null, 2))}</pre>`;
            log.appendChild(d); requestAnimationFrame(() => d.classList.add("in"));
          };
          add("⚡ Тригер: " + $("#sim-tr").selectedOptions[0].text, "trig", data);
          for (const s of steps) {
            await new Promise((r) => setTimeout(r, 650));
            const r = s.run(data, tr); data = r.data;
            add(s.icon + " " + s.name, r.warn ? "warn" : r.skip ? "skip" : "ok", r.out || data, r.note);
          }
          await new Promise((r) => setTimeout(r, 400));
          const fin = document.createElement("div"); fin.className = "sim-end"; fin.textContent = steps.length ? "🏁 Сценарій завершено" : "Додайте хоча б один крок";
          log.appendChild(fin); btn.disabled = false;
        });
      }
    }
  };

  const SIM_INPUT = {
    form: { client: "СТО Мотор", phone: "067-000-00-00", request: "Колодки передні Octavia A7 — 2 к-ти", urgent: "так" },
    email: { from: "moto@example.com", subject: "Терміново!", text: "Добрий день, потрібні колодки передні на Octavia A7 2 комплекти і фільтр MANN W712/75 4 шт. Сьогодні треба!" },
    tg: { chat: "Клієнт_017", text: "є фільтр W712/75? треба 4 шт" }
  };
  const SIM_STEPS = [
    { name: "ШІ: класифікація", icon: "🤖", def: true, run(d) {
      const t = JSON.stringify(d).toLowerCase();
      d.ai_type = /є |наявн|ціна/.test(t) && !/потрібн|треба \d|колодки/.test(t) ? "price_question" : "order";
      d.ai_urgent = /терміново|сьогодні|так/.test(t);
      return { data: d, note: "ШІ визначив тип і терміновість" }; } },
    { name: "ШІ: екстракція позицій у JSON", icon: "🤖", def: false, run(d) {
      const t = JSON.stringify(d); const items = [];
      if (/колодки/i.test(t)) items.push({ sku: "?", name: "Колодки передні Octavia A7", qty: 2, note: "підібрати артикул" });
      if (/W712\/75/.test(t)) items.push({ sku: "W712/75", brand: "MANN", qty: 4 });
      d.items = items; return { data: d, note: "З вільного тексту отримано структуровані позиції" }; } },
    { name: "Записати рядок у Google Sheets", icon: "📊", def: true, run(d) {
      d.row_id = 128; return { data: d, note: "Додано рядок №128" }; } },
    { name: "IF термінова → повідомити керівника", icon: "🔀", def: true, run(d) {
      const u = d.ai_urgent !== undefined ? d.ai_urgent : d.urgent === "так";
      if (d.ai_urgent === undefined && d.urgent === undefined) return { data: d, warn: true, note: "⚠️ Поля терміновості немає — без ШІ-класифікації вільний текст не «зрозуміти». Умова завжди хибна." };
      return { data: d, skip: !u, out: u ? { to: "керівник", text: "🔥 Термінова заявка: " + (d.client || d.chat || d.from) } : { route: "звичайна черга" }, note: u ? "Гілка «так»: повідомлення керівнику" : "Гілка «ні»: пропускаємо" }; } },
    { name: "Створити угоду в CRM", icon: "🎯", def: false, run(d) {
      if (!d.items && !d.request) return { data: d, warn: true, out: { deal_id: 5521, items: [] }, note: "⚠️ Угоду створено, але без позицій: у даних немає структурованого списку. Додайте крок екстракції!" };
      d.deal_id = 5521; return { data: d, out: { deal_id: 5521, client: d.client || d.chat || d.from, items: d.items || d.request }, note: "Угода №5521 на етапі «Нова заявка»" }; } },
    { name: "Telegram менеджеру", icon: "💬", def: true, run(d) {
      return { data: d, out: { to: "менеджер", text: `Нова заявка від ${d.client || d.chat || d.from}${d.items ? ": " + d.items.map((i) => (i.sku !== "?" ? i.sku : i.name) + " × " + i.qty).join(", ") : ""}` }, note: "Повідомлення надіслано" }; } }

  function reportText() {
    let t = `Звіт про навчання: «ШІ для продажів і керування бізнесом»\nСтудент: ${S.name || "—"}\nДата: ${new Date().toLocaleDateString("uk-UA")}\nЗагальний прогрес: ${overall()}%\n`;

      const st = weekState(w); if (!st.started) return;
      const q = S.quiz[w.n] || {};
      t += `\n— Тиждень ${w.n}. ${w.title} ${st.complete ? "✅ ЗАРАХОВАНО" : ""}\n  Теорія: ${LS(w) ? "уроки " + lessonsDone(w) + "/" + LS(w).length : (S.read[w.n] ? "так" : "ні")} · Тест: ${q.checked ? Math.round((q.score / w.quiz.length) * 100) + "%" : "не складено"} · Практика: ${tasksDone(w)}/${w.tasks.length}\n`;
      w.tasks.forEach((tk, i) => {
        const done = (S.tasks[w.n] || {})[i], note = (S.notes[w.n] || {})[i];

  function reportPage() {
    return `<header class="wk-head"><h1>📤 Звіт для ментора</h1><p class="goal">Прогрес зберігається лише в цьому браузері. Раз на тиждень копіюйте звіт і надсилайте ментору (Telegram, пошта) — так він бачитиме, що виконано, і всі ваші посилання на результати.</p></header>

  function mentorPage() {

      <li><b>Звіт</b>: студент надсилає скопійований звіт перед зустріччю. Дивіться на нотатки до завдань — там посилання на результати.</li>
      <li><b>n8n на вашому сервері</b>: окремий акаунт студента (роль member, без адмін-прав). Перевірте заздалегідь: публічна HTTPS-адреса для вебхуків (змінна WEBHOOK_URL) — без неї не запрацюють Telegram Trigger і зовнішні вебхуки; часовий пояс Europe/Kyiv (GENERIC_TIMEZONE) — інакше розклади «щопонеділка о 8:00» спрацьовуватимуть не тоді; резервні копії; ліміт часу виконання. Офіційні курси n8n Academy (learn.n8n.io) потребують власного інстансу — ваш підійде.</li>

      <tr><td>Тиждень 12</td><td>Захист проєкту, пробна співбесіда</td><td>Немає цифр результату</td></tr></table></div></section>
    <section><h2>Якщо студент відстає</h2><p>Нормально розтягнути курс до 4 місяців. Не можна пропускати практику: краще повільніше, але з робочими сценаріями. Тижні 9–11 можна скоротити, якщо фінальний проєкт вимагає більше часу.</p></section>`;
  }

  function copy(text, msgEl) {
    const done = () => { if (msgEl) { msgEl.textContent = "Скопійовано ✓"; setTimeout(() => (msgEl.textContent = ""), 2500); } };
    try {
      navigator.clipboard.writeText(text).then(done, () => fallback());
    } catch (e) { fallback(); }
    function fallback() {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { if (msgEl) msgEl.textContent = "Не вдалося — виділіть текст вручну"; }
      ta.remove();
    }
  }

  $("#menu-btn").addEventListener("click", () => document.body.classList.toggle("menu-open"));
  window.addEventListener("hashchange", route);
  route();
})();
