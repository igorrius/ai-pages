<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Розклад уроків 5-М класу — Київський ліцей №29 ім. П. Калнишевського">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Розклад 5-М">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Розклад 5-М · Ліцей №29</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Токени. Світла тема — базова, темна перевизначає лише кольори.
     ============================================================ */
  :root{
    color-scheme:light dark;

    --paper:#fbfaf6;
    --surface:#ffffff;
    --ink:#1f2a37;
    --ink-soft:#5b6673;
    --line:#e6e2d8;
    --line-strong:#d5cfc0;
    --today:#ffd541;
    --today-wash:#fff8d8;
    --accent:#e84420;
    --shadow:0 1px 2px rgba(31,42,55,.06), 0 8px 24px rgba(31,42,55,.06);
    --shadow-lg:0 24px 64px rgba(31,42,55,.22);

    /* Частка предметного кольору у фоні картки. У темній темі — менше. */
    --tint:100%;
    --lesson-ink:#1f2a37;
    --lesson-ink-soft:#3b4754;
    --badge-bg:rgba(255,255,255,.7);
    --track:rgba(31,42,55,.16);

    --radius:14px;
    --radius-lg:18px;
    --gutter:clamp(12px, 3.2vw, 22px);

    /* предметні кольори */
    --c-math:#bfe9f5;
    --c-ukr:#8ff05a;
    --c-ukrlit:#d7f5b0;
    --c-eng:#ffc02b;
    --c-nature:#fff23b;
    --c-world:#dff3a6;
    --c-tech:#f2e0ff;
    --c-inf:#e7d86a;
    --c-pe:#ffcfd0;
    --c-hist:#7de9e6;
    --c-art:#e5f56c;
    --c-live:#ff9e9e;
    --c-health:#7ee07e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#12161c;
      --surface:#1a2029;
      --ink:#e9edf2;
      --ink-soft:#98a4b3;
      --line:#2b3440;
      --line-strong:#3a4553;
      --today:#ffd541;
      --today-wash:#231f10;
      --accent:#ff7a5c;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      --shadow-lg:0 24px 64px rgba(0,0,0,.6);

      --tint:26%;
      --lesson-ink:#e9edf2;
      --lesson-ink-soft:#a9b5c3;
      --badge-bg:rgba(0,0,0,.28);
      --track:rgba(255,255,255,.18);
    }
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.3;overflow-wrap:break-word}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

  .app{max-width:1280px;margin:0 auto;
       padding:calc(14px + env(safe-area-inset-top)) calc(var(--gutter) + env(safe-area-inset-right))
               calc(40px + env(safe-area-inset-bottom)) calc(var(--gutter) + env(safe-area-inset-left))}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---------- шапка ---------- */
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
  .title{min-width:0}
  .title h1{margin:0;font-size:clamp(28px,7.5vw,42px);font-weight:900;letter-spacing:-.03em;line-height:1}
  .title p{margin:3px 0 0;color:var(--ink-soft);font-weight:700;font-size:clamp(12px,3vw,14px)}
  .clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(18px,5vw,22px);white-space:nowrap;
         padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface)}

  .install{display:none;margin:0 0 14px;padding:12px 16px;border-radius:12px;background:var(--ink);
           color:var(--paper);font-weight:800;width:100%}
  .install.show{display:block}

  /* ---------- панель «Зараз / Далі» ---------- */
  .status{display:grid;gap:10px;margin-bottom:16px;grid-template-columns:minmax(0,1fr)}
  @media (min-width:560px){.status{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .status.hidden{display:none}
  .status-card{min-width:0;border:2px solid var(--line);border-radius:var(--radius-lg);
               padding:13px 15px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
  .status-card.live{border-color:var(--accent)}
  .status-card.rest{grid-column:1/-1}
  .status-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
               font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
  .status-card.live .status-head{color:var(--accent)}
  .status-head .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto;
                    animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .status-card h2{margin:0;font-size:clamp(17px,4.4vw,20px);font-weight:800;line-height:1.2;overflow-wrap:anywhere}
  .status-card .sub{color:var(--ink-soft);font-weight:600;font-size:14px;overflow-wrap:anywhere}
  .bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .6s linear}
  .countdown{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}

  /* ---------- перемикач днів ---------- */
  .daybar{position:sticky;top:0;z-index:5;margin:0 calc(var(--gutter) * -1) 12px;
          padding:8px var(--gutter);background:color-mix(in srgb, var(--paper) 88%, transparent);
          backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid transparent}
  .daybar.stuck{border-bottom-color:var(--line)}
  .days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .day{min-width:0;padding:8px 4px;border-radius:12px;border:2px solid var(--line);background:var(--surface);
       font-weight:800;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15;
       transition:background .15s,border-color .15s,color .15s}
  .day .d{font-size:clamp(14px,3.8vw,16px)}
  .day .n{font-size:11px;color:var(--ink-soft);font-weight:700;white-space:nowrap}
  .day.today:not(.active){border-color:var(--today);background:var(--today-wash)}
  .day.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .day.active .n{color:color-mix(in srgb, var(--paper) 72%, transparent)}
  .day.today.active{box-shadow:inset 0 0 0 2px var(--today)}

  .jump{display:none;width:100%;margin:0 0 12px;padding:9px;border-radius:12px;
        border:2px dashed var(--line-strong);color:var(--ink-soft);font-weight:800;font-size:14px}
  .jump.show{display:block}

  /* ---------- список уроків ---------- */
  .week{display:grid;gap:8px}
  .col{display:none;gap:8px}
  .col.active{display:grid}
  .row{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;align-items:stretch;min-width:0}
  .slot{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;
        border-radius:12px;font-weight:900;font-size:20px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .slot time{font-size:11px;font-weight:700;line-height:1.15;text-align:center;margin-top:2px;white-space:nowrap}
  .row.is-now .slot{color:var(--accent)}

  .cell{display:grid;gap:6px;min-width:0}
  .cell.split{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (max-width:400px){.cell.split{grid-template-columns:minmax(0,1fr)}}

  .lesson{min-width:0;border-radius:var(--radius);padding:10px 12px;text-align:left;width:100%;overflow:hidden;
          display:flex;flex-direction:column;gap:3px;border:2px solid transparent;position:relative;
          background:color-mix(in srgb, var(--c) var(--tint), var(--surface));color:var(--lesson-ink);
          transition:opacity .15s,filter .15s,transform .1s}
  .lesson:active{transform:scale(.985)}
  .lesson-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-width:0}
  .lesson b{font-weight:800;font-size:15px;line-height:1.18;min-width:0;overflow-wrap:anywhere}
  .lesson .t{font-size:13px;font-weight:600;color:var(--lesson-ink-soft);overflow-wrap:anywhere}
  .lesson .r{flex:0 0 auto;font-size:12px;font-weight:800;background:var(--badge-bg);
             padding:2px 8px;border-radius:999px;white-space:nowrap}
  .lesson .r.none{opacity:.6;font-weight:700}
  .lesson.now-live{border-color:var(--accent);
                   box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent)}
  .lesson.now-live::before,.lesson.now-live::after{content:"";position:absolute;bottom:0;height:4px}
  .lesson.now-live::before{left:0;right:0;background:var(--track)}
  .lesson.now-live::after{left:0;width:var(--progress,0%);background:var(--accent);transition:width .6s linear}
  .lesson.dim{opacity:.3;filter:saturate(.35)}
  .vacancy b{font-style:italic}

  .free{border:2px dashed var(--line);border-radius:var(--radius);color:var(--ink-soft);
        font-weight:700;display:flex;align-items:center;padding:0 12px;font-size:14px}
  .row.pad{display:none}

  /* ---------- легенда-фільтр ---------- */
  .legend{margin-top:26px;border-top:2px solid var(--line);padding-top:16px}
  .legend p{margin:0 0 9px;font-weight:700;color:var(--ink-soft);font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:7px 13px;border-radius:999px;font-weight:800;font-size:13px;border:2px solid transparent;
        background:color-mix(in srgb, var(--c, var(--surface)) var(--tint), var(--surface));color:var(--lesson-ink)}
  .chip.on{border-color:var(--ink)}
  .chip.reset{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
  .note{margin-top:18px;color:var(--ink-soft);font-size:13px;font-weight:600;line-height:1.45}

  /* ---------- підручники ---------- */
  .books{margin-top:22px;border-top:2px solid var(--line);padding-top:16px}
  .books p{margin:0 0 9px;font-weight:700;color:var(--ink-soft);font-size:14px}
  .book-list{display:flex;flex-wrap:wrap;gap:8px}
  .book{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;
        font-weight:800;font-size:14px;text-decoration:none;border:2px solid transparent;
        background:color-mix(in srgb, var(--c, var(--surface)) var(--tint), var(--surface));color:var(--lesson-ink)}
  .book:hover,.book:focus-visible{border-color:var(--ink)}
  .book .b-sub{display:block;font-weight:600;font-size:12px;color:var(--ink-soft)}

  /* ---------- деталі уроку ---------- */
  dialog{border:0;border-radius:20px;padding:0;max-width:440px;width:calc(100% - 28px);
         background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg)}
  dialog::backdrop{background:rgba(10,14,19,.55);backdrop-filter:blur(2px)}
  .sheet{padding:22px}
  .sheet .kicker{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
  .sheet h2{margin:4px 0 0;font-size:clamp(20px,5.5vw,25px);font-weight:900;line-height:1.15;overflow-wrap:anywhere}
  .sheet dl{margin:16px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-weight:600}
  .sheet dt{color:var(--ink-soft);font-weight:700}
  .sheet dd{margin:0;overflow-wrap:anywhere}
  .sheet dd a{color:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px}
  .sheet .close{margin-top:20px;width:100%;padding:12px;border-radius:12px;background:var(--ink);
                color:var(--paper);font-weight:800}

  /* ---------- сповіщення про оновлення ---------- */
  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);visibility:hidden;
         bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;
         width:min(440px, calc(100% - 24px));display:flex;align-items:center;gap:12px;
         padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--paper);
         box-shadow:var(--shadow-lg);font-weight:700;font-size:14px;
         transition:transform .3s ease, visibility .3s}
  .toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
  .toast button{flex:0 0 auto;padding:8px 14px;border-radius:10px;background:var(--paper);color:var(--ink);font-weight:800}

  /* ============================================================
     Планшет / десктоп: увесь тиждень сіткою.
     ============================================================ */
  @media (min-width:900px){
    .daybar{display:none}
    .jump{display:none!important}
    .week{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
    .col{display:grid!important;grid-template-rows:auto;gap:8px}
    .col-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:7px 8px 5px;
              border-bottom:3px solid var(--line);font-weight:900;font-size:17px;
              position:sticky;top:0;background:var(--paper);z-index:1}
    .col-head small{color:var(--ink-soft);font-weight:700;font-size:12px;white-space:nowrap}
    .col.today .col-head{border-bottom-color:var(--today)}
    .col.today{background:var(--today-wash);border-radius:16px;padding:0 6px 6px;margin:0 -6px}
    .row{grid-template-columns:32px minmax(0,1fr);gap:6px;min-height:76px}
    .row.pad{display:block;min-height:0}
    @supports (grid-template-rows:subgrid){
      .week{grid-template-rows:auto repeat(var(--periods,7),auto)}
      .col{grid-row:1/-1;grid-template-rows:subgrid}
    }
    .slot{font-size:15px}
    .slot time{display:none}
    .lesson{padding:9px 10px}
    .lesson b{font-size:13.5px}
    .lesson .t{font-size:12px}
    .lesson .r{font-size:11px;padding:1px 7px}
    .cell.split{grid-template-columns:minmax(0,1fr)}
  }
  @media (max-width:899px){.col-head{display:none}}
  @media (min-width:1180px){
    .slot time{display:block}
    .row{grid-template-columns:46px minmax(0,1fr)}
    .lesson b{font-size:14.5px}
    .lesson .t{font-size:12.5px}
  }

  /* ---------- друк: завжди повний тиждень ---------- */
  @media print{
    :root{--paper:#fff;--surface:#fff;--ink:#000;--ink-soft:#444;--line:#bbb;--tint:100%;--shadow:none}
    .daybar,.legend,.install,.clock,.toast,.jump,.status{display:none!important}
    .app{max-width:none;padding:0}
    .week{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
    .col{display:grid!important;gap:6px;break-inside:avoid}
    .col-head{display:flex!important;border-bottom:2px solid #000}
    .col.today{background:none}
    .slot time{display:block}
    .lesson{border:1px solid #999;box-shadow:none}
    .lesson.now-live::before,.lesson.now-live::after{display:none}
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title">
      <h1>5-М</h1>
      <p>Ліцей №29 ім. П. Калнишевського · 2026/27</p>
    </div>
    <div class="clock" id="clock" aria-label="Поточний час">--:--</div>
  </header>

  <button class="install" id="install" type="button">Встановити на телефон</button>

  <section class="status" id="now" aria-live="polite" aria-label="Поточний та наступний урок"></section>

  <div class="daybar" id="daybar">
    <nav class="days" id="days" role="tablist" aria-label="Дні тижня"></nav>
  </div>

  <button class="jump" id="jump" type="button">← Повернутись до сьогодні</button>

  <main class="week" id="week"></main>

  <section class="legend">
    <p id="filter-label">Показати лише предмет</p>
    <div class="chips" id="chips" role="group" aria-labelledby="filter-label"></div>
    <p class="note">Дзвінки — за офіційним розкладом ліцею на 2026/27 н.р. Кабінет «—» означає, що аудиторію в розкладі ще не призначено. Дані станом на 06.09.2026.</p>
  </section>

  <section class="books" id="books" hidden>
    <p id="books-label">Підручники онлайн</p>
    <div class="book-list" id="book-list" role="list" aria-labelledby="books-label"></div>
  </section>
</div>

<dialog id="dlg" aria-labelledby="sheet-title"><div class="sheet" id="sheet"></div></dialog>

<div class="toast" id="toast" role="status">
  <span>Доступна нова версія розкладу</span>
  <button type="button" id="toast-btn">Оновити</button>
</div>

<script>
/* ---------- дані ---------- */
const BELLS = [
  null,
  ["08:30","09:15"],
  ["09:35","10:20"],
  ["10:40","11:25"],
  ["11:45","12:30"],
  ["12:50","13:35"],
  ["13:55","14:40"],
  ["14:50","15:35"],
  ["15:40","16:25"],
];

const SUBJ = {
  math:   {name:"Математика",             color:"var(--c-math)"},
  ukr:    {name:"Українська мова",        color:"var(--c-ukr)"},
  ukrlit: {name:"Українська література",  color:"var(--c-ukrlit)"},
  eng:    {name:"Англійська мова",        color:"var(--c-eng)"},
  nature: {name:"Пізнаємо природу",       color:"var(--c-nature)",
           book:{title:"Пізнаємо природу, 5 клас", author:"Д. Біда",
                 url:"https://pidruchnyk.com.ua/1718-piznaiemo-pryrodu-bida-5-klas.html"}},
  world:  {name:"Зарубіжна література",   color:"var(--c-world)"},
  tech:   {name:"Технології",             color:"var(--c-tech)"},
  inf:    {name:"Інформатика / STEM",     color:"var(--c-inf)"},
  pe:     {name:"Фізкультура",            color:"var(--c-pe)"},
  hist:   {name:"Історія / Суспільство",  color:"var(--c-hist)"},
  art:    {name:"Мистецтво",              color:"var(--c-art)"},
  live:   {name:"Вчимося жити разом",     color:"var(--c-live)"},
  health: {name:"Здоров'я, безпека та добробут", color:"var(--c-health)"},
};

// L(предмет, вчителі, кімната)
const L = (s, t, r) => ({s, t: Array.isArray(t) ? t : [t], r});
const VAC_INF = "Вакансія (інформатика)";
const VAC_HIST = "Вакансія (історія)";

const DAYS = [
  {short:"Пн", name:"Понеділок", lessons:{
    1:[L("nature","Римарчук О.М.","213")],
    2:[L("world","Ярмак Є.А.","213")],
    3:[L("tech","Захарченко Л.Л.","213")],
    4:[L("math","Рябошапка В.С.","213")],
    5:[L("inf",["Бернатович О.О.",VAC_INF],"213")],
    6:[L("inf",[VAC_INF,"Рябошапка В.О."],"213")],
  }},
  {short:"Вт", name:"Вівторок", lessons:{
    1:[L("math","Рябошапка В.С.")],
    2:[L("eng","Чередник С.В.")],
    3:[L("live","Парахонько М.М."), L("health","Романенко І.В.")],
    4:[L("ukr","Яремчук О.В.")],
    5:[L("pe","Міненко С.А.")],
    6:[L("inf",["Бернатович О.О.",VAC_INF]), L("inf",[VAC_INF,"Рябошапка В.О."])],
  }},
  {short:"Ср", name:"Середа", lessons:{
    1:[L("math","Рябошапка В.С.","213")],
    2:[L("tech","Захарченко Л.Л.","213")],
    3:[L("ukr","Яремчук О.В.","213")],
    4:[L("ukrlit","Яремчук О.В.")],
    5:[L("eng","Чередник С.В.","213")],
    6:[L("ukrlit","Яремчук О.В.","213")],
    7:[L("pe","Міненко С.А.","113")],
  }},
  {short:"Чт", name:"Четвер", lessons:{
    1:[L("ukr","Яремчук О.В.","213")],
    2:[L("hist",VAC_HIST,"213")],
    3:[L("nature","Римарчук О.М.","213")],
    4:[L("world","Ярмак Є.А.","213")],
    5:[L("math","Рябошапка В.С.","213")],
    6:[L("eng","Чередник С.В.","213")],
  }},
  {short:"Пт", name:"П'ятниця", lessons:{
    1:[L("math","Рябошапка В.С.","213")],
    2:[L("math","Рябошапка В.С.","213")],
    3:[L("art","Бохолдін А.О.","213")],
    4:[L("pe","Міненко С.А.","113")],
    5:[L("ukr","Яремчук О.В.","213")],
    6:[L("eng","Чередник С.В.","213")],
  }},
];

/* ---------- стан ---------- */
const $ = s => document.querySelector(s);
const todayIdx = (() => { const d = new Date().getDay(); return d>=1 && d<=5 ? d-1 : -1; })();
let activeDay = todayIdx >= 0 ? todayIdx : 0;
let filter = null;

const toMin = hm => { const [h,m]=hm.split(":").map(Number); return h*60+m; };
const lastPeriod = d => Math.max(...Object.keys(d.lessons).map(Number));
const maxPeriod = Math.max(...DAYS.map(lastPeriod));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural = (n, one, few, many) => n%10===1 && n%100!==11 ? one : (n%10>=2 && n%10<=4 && (n%100<12||n%100>14) ? few : many);
const lessonsCount = d => Object.keys(d.lessons).length;

/* ---------- рендер ---------- */
function renderDays(){
  $("#days").innerHTML = DAYS.map((d,i)=>{
    const n = lessonsCount(d);
    return `<button type="button" role="tab" class="day ${i===activeDay?"active":""} ${i===todayIdx?"today":""}"
        data-i="${i}" aria-selected="${i===activeDay}" aria-controls="col-${i}"
        aria-label="${esc(d.name)}, ${n} ${plural(n,"урок","уроки","уроків")}">
      <span class="d">${d.short}</span><span class="n">${n} ур.</span>
    </button>`;
  }).join("");
}

// k — індекс уроку в межах слоту: саме він розрізняє два паралельні уроки
// з однаковим предметом (наприклад дві групи інформатики).
function lessonHTML(l, di, p, k){
  const s = SUBJ[l.s];
  const vac = l.t.some(t => t.startsWith("Вакансія"));
  const room = l.r ? `каб. ${l.r}` : "кабінет не призначено";
  return `<button type="button" class="lesson ${vac?"vacancy":""}" style="--c:${s.color}"
            data-s="${l.s}" data-d="${di}" data-p="${p}" data-k="${k}"
            aria-label="${esc(s.name)}, ${p} урок, ${BELLS[p][0]}–${BELLS[p][1]}, ${esc(room)}, ${esc(l.t.join(", "))}">
      <span class="lesson-head">
        <b>${esc(s.name)}</b>
        <span class="r ${l.r?"":"none"}" aria-hidden="true">${l.r || "—"}</span>
      </span>
      <span class="t">${esc(l.t.join(" · "))}</span>
    </button>`;
}

function renderWeek(){
  $("#week").style.setProperty("--periods", maxPeriod);
  $("#week").innerHTML = DAYS.map((d,di)=>{
    const rows=[];
    for(let p=1;p<=maxPeriod;p++){
      const ls=d.lessons[p];
      if(!ls && p>lastPeriod(d)){ rows.push('<div class="row pad" aria-hidden="true"></div>'); continue; }
      const [a,b]=BELLS[p]||["",""];
      rows.push(`<div class="row" data-d="${di}" data-p="${p}">
        <div class="slot">${p}<time datetime="${a}">${a}<br>${b}</time></div>
        <div class="cell ${ls&&ls.length>1?"split":""}">
          ${ls ? ls.map((l,k)=>lessonHTML(l,di,p,k)).join("") : `<div class="free">вікно</div>`}
        </div></div>`);
    }
    const n = lessonsCount(d);
    return `<section id="col-${di}" class="col ${di===activeDay?"active":""} ${di===todayIdx?"today":""}"
             data-i="${di}" role="tabpanel" aria-label="${esc(d.name)}">
      <div class="col-head">${d.name}<small>${n} ${plural(n,"урок","уроки","уроків")}</small></div>${rows.join("")}</section>`;
  }).join("");
  applyFilter(); tick();
}

function renderChips(){
  const used=[...new Set(DAYS.flatMap(d=>Object.values(d.lessons).flat().map(l=>l.s)))];
  $("#chips").innerHTML = used.map(k=>
      `<button type="button" class="chip ${filter===k?"on":""}" data-s="${k}" style="--c:${SUBJ[k].color}"
        aria-pressed="${filter===k}">${esc(SUBJ[k].name)}</button>`).join("")
    + (filter?`<button type="button" class="chip reset" data-s="">Показати все</button>`:"");
}

// Секція з підручниками: лише для предметів, які реально є в розкладі.
function renderBooks(){
  const used=new Set(DAYS.flatMap(d=>Object.values(d.lessons).flat().map(l=>l.s)));
  const books=[...used].filter(k=>SUBJ[k].book);
  $("#books").hidden = books.length===0;
  $("#book-list").innerHTML = books.map(k=>{
    const b=SUBJ[k].book;
    return `<a class="book" role="listitem" style="--c:${SUBJ[k].color}" href="${esc(b.url)}"
              target="_blank" rel="noopener noreferrer">
      <span aria-hidden="true">📖</span>
      <span>${esc(b.title)}<span class="b-sub">${b.author?esc(b.author)+" · ":""}${esc(new URL(b.url).hostname)}</span></span>
    </a>`;
  }).join("");
}

function applyFilter(){
  document.querySelectorAll(".lesson").forEach(el=>el.classList.toggle("dim", !!filter && el.dataset.s!==filter));
}

/* ---------- годинник, «зараз / далі» ---------- */
function slotNames(d,p){ return d.lessons[p].map(l=>SUBJ[l.s].name).join(" / "); }
function slotRooms(d,p){ return [...new Set(d.lessons[p].map(l=>l.r).filter(Boolean))].join(", "); }
function slotTeachers(d,p){ return [...new Set(d.lessons[p].flatMap(l=>l.t))].join(" · "); }

function card({label, live, title, sub, progress, countdown}){
  return `<article class="status-card ${live?"live":""} ${label==="Вихідні"?"rest":""}">
    <p class="status-head">${live?'<span class="dot"></span>':""}${esc(label)}</p>
    <h2>${esc(title)}</h2>
    ${sub?`<p class="sub">${esc(sub)}</p>`:""}
    ${progress!=null?`<div class="bar" role="progressbar" aria-valuenow="${Math.round(progress)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${progress}%"></i></div>`:""}
    ${countdown?`<p class="countdown">${esc(countdown)}</p>`:""}
  </article>`;
}

function tick(){
  const now=new Date();
  $("#clock").textContent=now.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  const box=$("#now");
  document.querySelectorAll(".lesson.now-live").forEach(e=>{e.classList.remove("now-live");e.style.removeProperty("--progress");});
  document.querySelectorAll(".row.is-now").forEach(e=>e.classList.remove("is-now"));

  if(todayIdx<0){
    const d=DAYS[0], p=1;
    box.innerHTML = card({label:"Вихідні", title:"Уроків сьогодні немає",
      sub:`Наступні — у понеділок: ${slotNames(d,p)}, ${BELLS[p][0]}`});
    return;
  }

  const m=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  const d=DAYS[todayIdx];
  let cur=null, next=null;
  for(let p=1;p<=lastPeriod(d);p++){
    if(!d.lessons[p]) continue;
    const s=toMin(BELLS[p][0]), e=toMin(BELLS[p][1]);
    if(m>=s && m<e) cur=p;
    else if(s>m && next===null) next=p;
  }

  const first=Math.min(...Object.keys(d.lessons).map(Number));
  const cards=[];
  if(cur){
    const s=toMin(BELLS[cur][0]), e=toMin(BELLS[cur][1]);
    const rooms=slotRooms(d,cur);
    cards.push(card({label:`Зараз · ${cur} урок`, live:true, title:slotNames(d,cur),
      sub:`${BELLS[cur][0]}–${BELLS[cur][1]}${rooms?" · каб. "+rooms:""} · ${slotTeachers(d,cur)}`,
      progress:Math.min(100,Math.max(0,(m-s)/(e-s)*100)),
      countdown:`до дзвінка ${Math.max(1,Math.ceil(e-m))} хв`}));
  }else if(m < toMin(BELLS[first][0])){
    const n=lessonsCount(d);
    cards.push(card({label:"Сьогодні", title:`${d.name}, ${n} ${plural(n,"урок","уроки","уроків")}`,
      sub:`Початок о ${BELLS[first][0]}`,
      countdown:`до початку ${Math.max(1,Math.ceil(toMin(BELLS[first][0])-m))} хв`}));
  }else{
    cards.push(card({label:"Зараз", title: next ? "Перерва" : "Уроки закінчились",
      sub: next ? `Наступний урок о ${BELLS[next][0]}` : "Гарного відпочинку!"}));
  }

  if(next){
    const rooms=slotRooms(d,next);
    cards.push(card({label:`Далі · ${next} урок`, title:slotNames(d,next),
      sub:`${BELLS[next][0]}–${BELLS[next][1]}${rooms?" · каб. "+rooms:""} · ${slotTeachers(d,next)}`,
      countdown:`до початку ${Math.max(1,Math.ceil(toMin(BELLS[next][0])-m))} хв`}));
  }else{
    cards.push(card({label:"Далі", title:"На сьогодні все",
      sub: todayIdx<4 ? `Завтра — ${DAYS[todayIdx+1].name.toLowerCase()}, ${lessonsCount(DAYS[todayIdx+1])} уроків` : "Гарних вихідних!"}));
  }
  box.innerHTML = cards.join("");

  if(cur){
    const s=toMin(BELLS[cur][0]), e=toMin(BELLS[cur][1]);
    const pct=Math.min(100,Math.max(0,(m-s)/(e-s)*100));
    document.querySelectorAll(`.lesson[data-d="${todayIdx}"][data-p="${cur}"]`).forEach(el=>{
      el.classList.add("now-live"); el.style.setProperty("--progress", pct.toFixed(1)+"%");
    });
    const row=document.querySelector(`.row[data-d="${todayIdx}"][data-p="${cur}"]`);
    if(row) row.classList.add("is-now");
  }
}

/* ---------- навігація днями ---------- */
function setDay(i){
  activeDay=(i+5)%5;
  document.querySelectorAll(".day").forEach(b=>{
    const on=+b.dataset.i===activeDay;
    b.classList.toggle("active",on); b.setAttribute("aria-selected",on);
  });
  document.querySelectorAll(".col").forEach(c=>c.classList.toggle("active",+c.dataset.i===activeDay));
  $("#jump").classList.toggle("show", todayIdx>=0 && activeDay!==todayIdx);
}

$("#days").addEventListener("click",e=>{const b=e.target.closest(".day"); if(b) setDay(+b.dataset.i);});
$("#jump").addEventListener("click",()=>{ if(todayIdx>=0) setDay(todayIdx); });

$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  filter = (b.dataset.s && b.dataset.s!==filter) ? b.dataset.s : null;
  renderChips(); applyFilter();
});

/* ---------- деталі уроку ---------- */
const dlg=$("#dlg");
$("#week").addEventListener("click",e=>{
  const b=e.target.closest(".lesson"); if(!b) return;
  const d=DAYS[+b.dataset.d], p=+b.dataset.p, all=d.lessons[p];
  const l=all[+b.dataset.k];
  const others=all.filter((_,i)=>i!==+b.dataset.k);
  $("#sheet").innerHTML=`<p class="kicker">${esc(d.name)} · ${p} урок</p>
    <h2 id="sheet-title">${esc(SUBJ[l.s].name)}</h2>
    <dl><dt>Час</dt><dd>${BELLS[p][0]}–${BELLS[p][1]}</dd>
        <dt>Кабінет</dt><dd>${l.r ? esc(l.r) : "не призначено"}</dd>
        <dt>${l.t.length>1?"Вчителі":"Вчитель"}</dt><dd>${l.t.map(esc).join("<br>")}</dd>
        ${others.length?`<dt>Паралельно</dt><dd>${others.map(x=>esc(SUBJ[x.s].name+" — "+x.t.join(", "))).join("<br>")}</dd>`:""}
        ${SUBJ[l.s].book?`<dt>Підручник</dt><dd><a href="${esc(SUBJ[l.s].book.url)}" target="_blank" rel="noopener noreferrer">${esc(SUBJ[l.s].book.title)}</a>${SUBJ[l.s].book.author?" · "+esc(SUBJ[l.s].book.author):""}</dd>`:""}
    </dl><button type="button" class="close" data-close>Закрити</button>`;
  dlg.showModal();
});
dlg.addEventListener("click",e=>{ if(e.target===dlg || e.target.hasAttribute("data-close")) dlg.close(); });

/* ---------- клавіатура та свайп ---------- */
document.addEventListener("keydown",e=>{
  if(dlg.open) return;
  if(e.key==="ArrowRight") setDay(activeDay+1);
  else if(e.key==="ArrowLeft") setDay(activeDay-1);
  else if(e.key==="Home" && todayIdx>=0) setDay(todayIdx);
});
let sx=0, sy=0;
$("#week").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
$("#week").addEventListener("touchend",e=>{
  if(matchMedia("(min-width:900px)").matches) return;      // на тижневій сітці свайп не потрібен
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6) setDay(activeDay+(dx<0?1:-1));
},{passive:true});

/* ---------- «прилипла» панель днів ---------- */
const daybar=$("#daybar");
let raf=0;
addEventListener("scroll",()=>{
  if(raf) return;
  raf=requestAnimationFrame(()=>{ raf=0; daybar.classList.toggle("stuck", daybar.getBoundingClientRect().top<=0.5); });
},{passive:true});

/* ---------- PWA ---------- */
const toast=$("#toast");
if("serviceWorker" in navigator){
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(reloading) return; reloading=true; location.reload();
  });
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const offer=w=>{ if(!w) return;
      $("#toast-btn").onclick=()=>{ w.postMessage({type:"SKIP_WAITING"}); toast.classList.remove("show"); };
      toast.classList.add("show");
    };
    if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound",()=>{
      const nw=reg.installing; if(!nw) return;
      nw.addEventListener("statechange",()=>{
        if(nw.state==="installed" && navigator.serviceWorker.controller) offer(nw);
      });
    });
    setInterval(()=>reg.update(), 60*60*1000);
  }).catch(()=>{});
}

let deferredPrompt=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("#install").classList.add("show");});
$("#install").addEventListener("click",async()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice;
  deferredPrompt=null; $("#install").classList.remove("show");
});
addEventListener("appinstalled",()=>$("#install").classList.remove("show"));

/* ---------- старт ---------- */
renderDays(); renderWeek(); renderChips(); renderBooks(); setDay(activeDay);
setInterval(tick, 10000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tick(); });
addEventListener("focus", tick);
</script>
</body>
</html>
