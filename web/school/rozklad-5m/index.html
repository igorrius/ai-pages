<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Розклад 5-М">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Розклад 5-М · Ліцей №29</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbfaf6;
    --ink:#1f2a37;
    --ink-soft:#5b6673;
    --line:#e6e2d8;
    --today:#ffd541;
    --now:#ff5a36;
    --radius:14px;

    /* предметні кольори */
    --c-math:#bfe9f5;
    --c-ukr:#8ff05a;
    --c-ukrlit:#d7f5b0;
    --c-eng:#ffc02b;
    --c-nature:#fff23b;
    --c-world:#dff3a6;
    --c-tech:#f2e0ff;
    --c-inf:#e7d86a;
    --c-pe:#ffcfd0;
    --c-hist:#7de9e6;
    --c-art:#e5f56c;
    --c-live:#ff9e9e;
    --c-health:#7ee07e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.3}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,.lesson:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  .app{max-width:1180px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(48px + env(safe-area-inset-bottom))}
  .install{display:none;margin:0 0 14px;padding:11px 14px;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;width:100%}
  .install.show{display:block}

  /* ---------- шапка ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
  .title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .title h1{margin:0;font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1}
  .title p{margin:0;color:var(--ink-soft);font-weight:700}
  .clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:20px;white-space:nowrap}

  /* ---------- "Зараз / Далі" ---------- */
  .now{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .now-card{border:2px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-height:74px}
  .now-card.live{border-color:var(--now)}
  .now-card small{display:block;color:var(--ink-soft);font-weight:700;margin-bottom:2px}
  .now-card b{font-size:18px;font-weight:800;display:block}
  .now-card span{color:var(--ink-soft);font-weight:600;font-size:14px}
  .now-card.live small{color:var(--now)}
  .now.hidden{display:none}

  /* ---------- дні ---------- */
  .days{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;padding:2px 2px 4px;margin-left:-2px;margin-right:-2px}
  .day{scroll-snap-align:center}
  .days::-webkit-scrollbar{display:none}
  .day{flex:1 0 auto;padding:9px 12px;border-radius:999px;border:2px solid var(--line);font-weight:800;
       display:flex;align-items:center;gap:8px;justify-content:center;transition:background .15s,border-color .15s}
  .day .n{font-size:12px;color:var(--ink-soft);font-weight:700}
  .day.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .day.active .n{color:#cfd6de}
  .day.today:not(.active){border-color:var(--today);background:#fff8d8}
  .day.today::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--today)}
  .day.today.active::before{background:var(--today)}

  /* ---------- список на день (мобільний) ---------- */
  .week{display:grid;gap:8px}
  .col{display:none;gap:8px}
  .col.active{display:grid}
  .row{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:stretch}
  .slot{display:flex;flex-direction:column;align-items:center;justify-content:center;
        border-radius:12px;font-weight:900;font-size:20px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .slot time{font-size:11px;font-weight:700;line-height:1.1;text-align:center;margin-top:2px}
  .cell{display:grid;gap:6px}
  .cell.split{grid-template-columns:1fr 1fr}
  .lesson{border-radius:var(--radius);padding:10px 12px;text-align:left;width:100%;
          display:flex;flex-direction:column;gap:2px;border:2px solid transparent;
          transition:opacity .15s,transform .1s;position:relative}
  .lesson:active{transform:scale(.985)}
  .lesson b{font-weight:800;font-size:15px;line-height:1.15;padding-right:42px}
  .lesson .t{font-size:13px;font-weight:600;color:#33404d}
  .lesson .r{font-size:12px;font-weight:800;position:absolute;right:10px;top:9px;
             background:rgba(255,255,255,.65);padding:1px 7px;border-radius:999px}
  .lesson .r.none{opacity:.55;font-weight:700}
  .lesson.now-live{border-color:var(--now);box-shadow:0 0 0 3px #ffd9cf}
  .lesson.dim{opacity:.22}
  .row.pad{display:none}
  .free{border:2px dashed var(--line);border-radius:var(--radius);color:var(--ink-soft);
        font-weight:700;display:flex;align-items:center;padding:0 12px;font-size:14px}
  .vacancy b{font-style:italic}

  /* ---------- легенда-фільтр ---------- */
  .legend{margin-top:22px;border-top:2px solid var(--line);padding-top:14px}
  .legend p{margin:0 0 8px;font-weight:700;color:var(--ink-soft);font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;border:2px solid transparent}
  .chip.on{border-color:var(--ink)}
  .chip.reset{background:#fff;border-color:var(--line)}
  .note{margin-top:16px;color:var(--ink-soft);font-size:13px;font-weight:600}

  /* ---------- деталі уроку ---------- */
  dialog{border:0;border-radius:18px;padding:0;max-width:420px;width:calc(100% - 28px);
         box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(31,42,55,.45)}
  .sheet{padding:20px}
  .sheet h2{margin:0 0 4px;font-size:24px;font-weight:900}
  .sheet dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-weight:600}
  .sheet dt{color:var(--ink-soft);font-weight:700}
  .sheet dd{margin:0}
  .sheet .close{margin-top:16px;width:100%;padding:11px;border-radius:12px;background:var(--ink);color:#fff;font-weight:800}

  /* ---------- планшет / десктоп: тиждень сіткою ---------- */
  @media (min-width:860px){
    .days{display:none}
    .now{grid-template-columns:1fr 1fr 1fr}
    .week{grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}
    .col{display:grid!important;grid-template-rows:auto;gap:8px}
    .col-head{display:flex;align-items:baseline;justify-content:space-between;padding:6px 8px 4px;
              border-bottom:3px solid var(--line);font-weight:900;font-size:18px;position:sticky;top:0;background:var(--paper);z-index:1}
    .col-head small{color:var(--ink-soft);font-weight:700;font-size:13px}
    .col.today .col-head{border-bottom-color:var(--today)}
    .col.today{background:#fffbe8;border-radius:16px;padding:0 6px 6px;margin:0 -6px}
    .row{grid-template-columns:34px 1fr;gap:6px;min-height:78px}
    .row.pad{display:block;min-height:0}
    @supports (grid-template-rows:subgrid){
      .week{grid-template-rows:auto repeat(var(--periods,7),auto)}
      .col{grid-row:1/-1;grid-template-rows:subgrid}
    }
    .slot{font-size:15px}
    .slot time{display:none}
    .lesson b{font-size:14px}
    .lesson .t{font-size:12px}
    .cell.split{grid-template-columns:1fr}
  }
  @media (max-width:859px){.col-head{display:none}}
  @media (min-width:1100px){.slot time{display:block}.row{grid-template-columns:46px 1fr}}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <h1>5-М</h1>
      <p>Ліцей №29 ім. П. Калнишевського · 2026/27</p>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <button class="install" id="install">Встановити на телефон</button>
  <section class="now" id="now" aria-live="polite"></section>

  <nav class="days" id="days" aria-label="Дні тижня"></nav>

  <main class="week" id="week"></main>

  <section class="legend">
    <p>Показати лише предмет</p>
    <div class="chips" id="chips"></div>
    <p class="note">Дзвінки — за офіційним розкладом ліцею на 2026/27 н.р. Кімната «—» означає, що аудиторію в розкладі ще не призначено. Дані станом на 02.09.2026.</p>
  </section>
</div>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>

<script>
/* ---------- дані ---------- */
const BELLS = [
  null,
  ["08:30","09:15"],
  ["09:35","10:20"],
  ["10:40","11:25"],
  ["11:45","12:30"],
  ["12:50","13:35"],
  ["13:55","14:40"],
  ["14:50","15:35"],
  ["15:40","16:25"],
];

const SUBJ = {
  math:   {name:"Математика",             color:"var(--c-math)"},
  ukr:    {name:"Українська мова",        color:"var(--c-ukr)"},
  ukrlit: {name:"Українська література",  color:"var(--c-ukrlit)"},
  eng:    {name:"Англійська мова",        color:"var(--c-eng)"},
  nature: {name:"Пізнаємо природу",       color:"var(--c-nature)"},
  world:  {name:"Зарубіжна література",   color:"var(--c-world)"},
  tech:   {name:"Технології",             color:"var(--c-tech)"},
  inf:    {name:"Інформатика / STEM",     color:"var(--c-inf)"},
  pe:     {name:"Фізкультура",            color:"var(--c-pe)"},
  hist:   {name:"Історія / Суспільство",  color:"var(--c-hist)"},
  art:    {name:"Мистецтво",              color:"var(--c-art)"},
  live:   {name:"Вчимося жити разом",     color:"var(--c-live)"},
  health: {name:"Здоров'я, безпека та добробут", color:"var(--c-health)"},
};

// L(предмет, вчителі, кімната)
const L = (s, t, r) => ({s, t: Array.isArray(t) ? t : [t], r});
const VAC_INF = "Вакансія (інформатика)";
const VAC_HIST = "Вакансія (історія)";

const DAYS = [
  {short:"Пн", name:"Понеділок", lessons:{
    1:[L("nature","Римарчук О.М.")],
    2:[L("world","Ярмак Є.А.")],
    3:[L("tech","Захарченко Л.Л.")],
    4:[L("math","Рябошапка В.С.")],
    5:[L("inf",["Бернатович О.О.",VAC_INF])],
    6:[L("inf",[VAC_INF,"Рябошапка В.О."])],
  }},
  {short:"Вт", name:"Вівторок", lessons:{
    1:[L("math","Рябошапка В.С.")],
    2:[L("eng","Чередник С.В.")],
    3:[L("live","Парахонько М.М."), L("health","Романенко І.В.")],
    4:[L("ukr","Яремчук О.В.")],
    5:[L("pe","Міненко С.А.")],
    6:[L("inf",["Бернатович О.О.",VAC_INF]), L("inf",[VAC_INF,"Рябошапка В.О."])],
  }},
  {short:"Ср", name:"Середа", lessons:{
    1:[L("math","Рябошапка В.С.","213")],
    2:[L("tech","Захарченко Л.Л.","213")],
    3:[L("ukr","Яремчук О.В.","213")],
    4:[L("ukrlit","Яремчук О.В.")],
    5:[L("eng","Чередник С.В.","213")],
    6:[L("ukrlit","Яремчук О.В.","213")],
    7:[L("pe","Міненко С.А.","113")],
  }},
  {short:"Чт", name:"Четвер", lessons:{
    1:[L("ukr","Яремчук О.В.","213")],
    2:[L("hist",VAC_HIST,"213")],
    3:[L("nature","Римарчук О.М.","213")],
    4:[L("world","Ярмак Є.А.","213")],
    5:[L("math","Рябошапка В.С.","213")],
    6:[L("eng","Чередник С.В.","213")],
  }},
  {short:"Пт", name:"П'ятниця", lessons:{
    1:[L("math","Рябошапка В.С.")],
    2:[L("math","Рябошапка В.С.")],
    3:[L("art","Бохолдін А.О.")],
    4:[L("pe","Міненко С.А.")],
    5:[L("ukr","Яремчук О.В.","213")],
    6:[L("eng","Чередник С.В.")],
  }},
];

/* ---------- стан ---------- */
const $ = s => document.querySelector(s);
const todayIdx = (() => { const d = new Date().getDay(); return d>=1 && d<=5 ? d-1 : -1; })();
let activeDay = todayIdx >= 0 ? todayIdx : 0;
let filter = null;

const toMin = hm => { const [h,m]=hm.split(":").map(Number); return h*60+m; };
const lastPeriod = d => Math.max(...Object.keys(d.lessons).map(Number));
const maxPeriod = Math.max(...DAYS.map(lastPeriod));

/* ---------- рендер ---------- */
function renderDays(){
  $("#days").innerHTML = DAYS.map((d,i)=>`
    <button class="day ${i===activeDay?"active":""} ${i===todayIdx?"today":""}" data-i="${i}" aria-pressed="${i===activeDay}">
      ${d.short}<span class="n">${Object.keys(d.lessons).length} ур.</span>
    </button>`).join("");
}

function lessonHTML(l, di, p){
  const s = SUBJ[l.s];
  const vac = l.t.some(t=>t.startsWith("Вакансія"));
  return `<button class="lesson ${vac?"vacancy":""}" data-s="${l.s}" data-d="${di}" data-p="${p}"
            style="background:${s.color}">
      <b>${s.name}</b>
      <span class="t">${l.t.join(" · ")}</span>
      <span class="r ${l.r?"":"none"}">${l.r || "—"}</span>
    </button>`;
}

function renderWeek(){
  $("#week").style.setProperty("--periods", maxPeriod);
  $("#week").innerHTML = DAYS.map((d,di)=>{
    const rows=[];
    for(let p=1;p<=maxPeriod;p++){
      const ls=d.lessons[p];
      if(!ls && p>lastPeriod(d)){ rows.push('<div class="row pad" aria-hidden="true"></div>'); continue; }
      const [a,b]=BELLS[p]||["",""];
      rows.push(`<div class="row">
        <div class="slot">${p}<time>${a}<br>${b}</time></div>
        <div class="cell ${ls&&ls.length>1?"split":""}">
          ${ls ? ls.map(l=>lessonHTML(l,di,p)).join("") : `<div class="free">вікно</div>`}
        </div></div>`);
    }
    return `<section class="col ${di===activeDay?"active":""} ${di===todayIdx?"today":""}" data-i="${di}">
      <div class="col-head">${d.name}<small>${Object.keys(d.lessons).length} уроків</small></div>${rows.join("")}</section>`;
  }).join("");
  applyFilter(); tick();
}

function renderChips(){
  const used=[...new Set(DAYS.flatMap(d=>Object.values(d.lessons).flat().map(l=>l.s)))];
  $("#chips").innerHTML = used.map(k=>`<button class="chip ${filter===k?"on":""}" data-s="${k}" style="background:${SUBJ[k].color}">${SUBJ[k].name}</button>`).join("")
    + (filter?`<button class="chip reset" data-s="">Показати все</button>`:"");
}

function applyFilter(){
  document.querySelectorAll(".lesson").forEach(el=>el.classList.toggle("dim", !!filter && el.dataset.s!==filter));
}

/* ---------- годинник, "зараз / далі" ---------- */
function tick(){
  const now=new Date();
  $("#clock").textContent=now.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  const box=$("#now");
  document.querySelectorAll(".lesson.now-live").forEach(e=>e.classList.remove("now-live"));
  if(todayIdx<0){ box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  const m=now.getHours()*60+now.getMinutes();
  const d=DAYS[todayIdx];
  let cur=null, next=null;
  for(let p=1;p<=lastPeriod(d);p++){
    const [a,b]=BELLS[p]; const s=toMin(a), e=toMin(b);
    if(d.lessons[p] && m>=s && m<e){ cur=p; }
    else if(d.lessons[p] && s>m && next===null){ next=p; }
  }
  const card=(label,p,live)=>{
    if(!p) return `<div class="now-card"><small>${label}</small><b>—</b><span>${live?"уроків зараз немає":"на сьогодні все"}</span></div>`;
    const names=d.lessons[p].map(l=>SUBJ[l.s].name).join(" / ");
    const rooms=[...new Set(d.lessons[p].map(l=>l.r).filter(Boolean))].join(", ");
    return `<div class="now-card ${live?"live":""}"><small>${label} · ${p} урок</small><b>${names}</b>
      <span>${BELLS[p][0]}–${BELLS[p][1]}${rooms?" · каб. "+rooms:""}</span></div>`;
  };
  let left="";
  if(cur){ const e=toMin(BELLS[cur][1]); left=`до дзвінка ${e-m} хв`; }
  else if(next){ left=`до початку ${toMin(BELLS[next][0])-m} хв`; }
  box.innerHTML = card("Зараз",cur,true) + card("Далі",next,false)
    + (left?`<div class="now-card"><small>Таймер</small><b>${left}</b><span>${d.name}</span></div>`:"");
  if(cur) document.querySelectorAll(`.lesson[data-d="${todayIdx}"][data-p="${cur}"]`).forEach(e=>e.classList.add("now-live"));
}

/* ---------- події ---------- */
function setDay(i){
  activeDay=(i+5)%5;
  document.querySelectorAll(".day").forEach(b=>{const on=+b.dataset.i===activeDay;b.classList.toggle("active",on);b.setAttribute("aria-pressed",on);});
  document.querySelectorAll(".col").forEach(c=>c.classList.toggle("active",+c.dataset.i===activeDay));
  const tab=document.querySelector(`.day[data-i="${activeDay}"]`);
  if(tab) tab.scrollIntoView({block:"nearest",inline:"center",behavior:reduceMotion?"auto":"smooth"});
}
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
$("#days").addEventListener("click",e=>{const b=e.target.closest(".day"); if(b) setDay(+b.dataset.i);});
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  filter = (b.dataset.s && b.dataset.s!==filter) ? b.dataset.s : null;
  renderChips(); applyFilter();
});
$("#week").addEventListener("click",e=>{
  const b=e.target.closest(".lesson"); if(!b) return;
  const d=DAYS[b.dataset.d], p=+b.dataset.p;
  const l=d.lessons[p].find(x=>x.s===b.dataset.s && d.lessons[p].indexOf(x)>=0);
  const all=d.lessons[p];
  $("#sheet").innerHTML=`<h2>${SUBJ[l.s].name}</h2>
    <dl><dt>День</dt><dd>${d.name}, ${p} урок</dd>
        <dt>Час</dt><dd>${BELLS[p][0]}–${BELLS[p][1]}</dd>
        <dt>Кабінет</dt><dd>${l.r||"не призначено"}</dd>
        <dt>${l.t.length>1?"Вчителі":"Вчитель"}</dt><dd>${l.t.join("<br>")}</dd>
        ${all.length>1?`<dt>Паралельно</dt><dd>${all.filter(x=>x!==l).map(x=>SUBJ[x.s].name+" — "+x.t.join(", ")).join("<br>")}</dd>`:""}
    </dl><button class="close" onclick="dlg.close()">Закрити</button>`;
  dlg.showModal();
});
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });

// клавіатура та свайп
document.addEventListener("keydown",e=>{
  if(dlg.open) return;
  if(e.key==="ArrowRight") setDay(activeDay+1);
  if(e.key==="ArrowLeft")  setDay(activeDay-1);
});
let sx=0;
$("#week").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;},{passive:true});
$("#week").addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>60) setDay(activeDay+(dx<0?1:-1));
},{passive:true});

/* ---------- PWA ---------- */
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("#install").classList.add("show");});
$("#install").addEventListener("click",async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $("#install").classList.remove("show"); });
window.addEventListener("appinstalled",()=>$("#install").classList.remove("show"));

/* ---------- старт ---------- */
renderDays(); renderWeek(); renderChips(); setDay(activeDay);
setInterval(tick,15000);
</script>
</body>
</html>
